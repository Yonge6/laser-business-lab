# Include inside the existing maker.wonderelian.com server block only.
# Keep its TLS, server_name, root and any explicitly proxied API locations.
# The production release symlink defaults to /srv/wonderelian/maker.wonderelian.com.
index index.html;
autoindex off;

# A missing build asset is a 404, never an HTML homepage response.
location ^~ /_next/static/ {
    try_files $uri =404;
}

# next.config.ts exports each route as <route>/index.html (trailingSlash: true).
# Test files, not directories: an unexported directory must also return 404.
location / {
    try_files $uri $uri/index.html =404;
}

# Preserve the original 404 status while displaying Next's exported not-found UI.
# Do not use "error_page 404 =200 ..." or a /index.html fallback.
error_page 404 /404.html;
location = /404.html {
    internal;
}
