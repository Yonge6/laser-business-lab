name: MakerBusinessLab
options:
  bundleIdPrefix: com.wonderelian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L855ZVM679
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
targets:
  MakerBusinessLab:
    type: application
    platform: iOS
    sources:
      - MakerBusinessLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderelian.makerbusinesslab
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 13
        INFOPLIST_FILE: MakerBusinessLab/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - MakerBusinessLabTests
  MakerBusinessLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MakerBusinessLabTests
    dependencies:
      - target: MakerBusinessLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderelian.makerbusinesslab.tests
        GENERATE_INFOPLIST_FILE: true
